# ==============================================================================
# Sparkyard — EXAMPLE model definitions (public, downloadable).
# `make init` copies this to models.yaml (gitignored) on first run; edit that.
# `make render` then generates llama-swap/config.yaml + LiteLLM/config.yaml.
#
# Placeholders {llm_root} {repo_path} {home} are filled from settings.local.yaml
# at render time. Paths under `path:`/`gguf:` are relative to the in-container
# /models mount. `vllm_flags`/`llamacpp_flags` pass through verbatim (one
# flag+value per list item). ${PORT}/${host} are llama-swap macros.
#
# vLLM models need the externally-built `vllm-node:latest` image
# (see vllm/VLLM_NODE_PROVENANCE.md). llama.cpp models use the locally-built
# sparkyard/llama-cpp-spark:latest image (`make build`).
# ==============================================================================

defaults:
  vllm:
    image: vllm-node:latest
    gmem_min: 0.12
    gmem_max: 0.85
    safety_gib: 6
    ttl: 3600
    ready_timeout: 1800
    check_endpoint: "/health"
  llamacpp:
    image: sparkyard/llama-cpp-spark:latest
    ttl: 3600
    ready_timeout: 600
    check_endpoint: "/health"
    n_gpu_layers: 99
    parallel: 4

# Sizing on unified memory: `gmem.max` is a RESERVATION, not a ceiling — vLLM
# takes the whole fraction as system RAM. Peak ~= 20.5GB + gmem x 111.51GB on a
# 128GB GB10. Avoid `--load-format fastsafetensors`: it buffers the full weight
# set during load (measured 86GB peak vs 54GB without on a 21.8GB model).
# See the README's "GB10 / unified-memory gotchas" section; `sparkyard doctor`
# flags both.
# groups (optional): which models may stay loaded at the same time. Omit this
# key and llama-swap keeps its default behaviour — one model at a time. Use it
# when a small always-on model (embeddings, a draft model) must survive a large
# model loading. Members are model names from `models:` below, never aliases,
# and a model may belong to at most one group.
#
# groups:
#   resident:
#     swap: false        # members run together instead of swapping each other out
#     exclusive: false   # loading a member does not unload other groups
#     persistent: true   # other groups can never unload this one
#     members:
#       - My-Embedding-Model

# Two-node tensor-parallel (needs a `cluster:` block in settings.local.yaml; see
# the README's "Two-node (CX7) cluster"). Do not set -tp/--tensor-parallel-size,
# --nnodes, --headless etc. in vllm_flags — the launcher owns them. Put this
# entry under `models:` below; only one nodes: 2 model can be resident at a time.
#
#   - name: My-Large-Model
#     engine: vllm
#     nodes: 2
#     container: vllm-my-large
#     hf_repo: org/My-Large-Model
#     path: vllm/org/My-Large-Model
#     max_model_len: 65536
#     max_num_seqs: 4
#     kv_dtype_bytes: 1
#     # gmem is per node, and each node holds half the weights + KV: size the
#     # floor from `sparkyard explain`, not from a single-node value.
#     gmem: { min: 0.20, max: 0.60 }
#     ready_timeout: 1800
#     # extra_docker_args: "-e NCCL_DEBUG=INFO"   # verify NET/IB, then remove
#     litellm:
#       max_tokens: 8192

models:
  # ---- vLLM (safetensors) ----
  - name: Qwen2.5-3B-Instruct
    engine: vllm
    container: vllm-qwen25-3b
    hf_repo: Qwen/Qwen2.5-3B-Instruct
    path: vllm/Qwen/Qwen2.5-3B-Instruct
    max_model_len: 32768
    max_num_seqs: 8
    kv_dtype_bytes: 2
    litellm:
      max_tokens: 8192

  - name: Qwen2.5-Coder-7B-Instruct
    engine: vllm
    container: vllm-qwen25-coder-7b
    hf_repo: Qwen/Qwen2.5-Coder-7B-Instruct
    path: vllm/Qwen/Qwen2.5-Coder-7B-Instruct
    max_model_len: 32768
    max_num_seqs: 8
    kv_dtype_bytes: 2
    litellm:
      max_tokens: 8192

  # ---- llama.cpp (GGUF) ----
  - name: Qwen2.5-3B-Instruct-GGUF
    engine: llamacpp
    container: llamacpp-qwen25-3b
    hf_repo: bartowski/Qwen2.5-3B-Instruct-GGUF
    mount: "{llm_root}/ollama:/models/ollama"
    gguf: ollama/bartowski/Qwen2.5-3B-Instruct-GGUF/Qwen2.5-3B-Instruct-Q4_K_M.gguf
    ctx_size: 32768
    parallel: 4
    no_mmap: true
    unified_memory: true
    llamacpp_flags:
      - --jinja
